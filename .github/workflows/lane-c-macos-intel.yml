# PS-6I Lane C — macOS Intel first-class evidence (public multi-repo lane).
#
# Purpose: first-class darwin Intel/x64 support evidence — the Lane C
# transformation (PS-6I): the previous refusal-honesty purpose is replaced
# by SUPPORTED real-stack evidence: exact Node 22.23.2 darwin-x64
# (architecture ASSERTED x64 — native Intel, never emulated), deterministic
# install, build, typecheck, full test suite, the dedicated mandatory APFS
# evidence invocation (skips make the evidence job RED, never a silent
# green), direct executable/package checks, exact Git 2.45.4 provisioning
# (digest-pinned kernel.org source, built version asserted), volume
# case-sensitivity record, and the real-stack subsection built on the
# runner from the EXACT component source commits — the macOS Intel Gateway
# fork (mfx-labs/project-gateway-macos @
# a90284b06420effb1ec1eeef14e7ed82e02c64e9 = PGM-DIST-1 pinned
# provenance-complete Git-tree candidate; the historical
# mfx-labs/project-gateway pin is NEVER used
# by Lane C) and mfx-labs/pi-guard @
# 7a7580cc4cbd7926797564c72269394fc29a860a = v0.1.2 — via the committed
# scripts/prepare-fixtures.sh boundary with the lane passed EXPLICITLY
# (--lane darwin-x86_64-posix-utf8-node22) and the C3B1 real-stack
# handshake lane propagated EXPLICITLY (GATEWAY_LANE) — never ambient or
# defaulted. No external fixture hosting, no fixture_source input, no curl
# fixture download, no secrets (both component repositories are public).
#
# Component identities are repository-owned constants (this file), never
# user-supplied workflow_dispatch refs; the checked-out HEAD of every
# component is asserted against its exact pin before any build.
#
# The lane runs on the GitHub Intel macOS runner (macos-15-intel); Lane A
# (Linux) and Lane B (Apple Silicon) behavior is unchanged.
name: Lane C — macOS Intel evidence

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Repository-owned exact component pins (PS-6 public multi-repo lane).
  # Lane C Gateway: the macOS Intel fork at the PGM-DIST-1 pinned
  # provenance-complete Git-tree candidate commit (the first whose Git
  # tree carries the tracked darwin-x64 addon required by the Intel
  # runtime boundary). CI wiring consumes technical identity only —
  # never a release, availability, or support claim. The checked-out
  # fork HEAD is asserted against this pin before use.
  GATEWAY_COMMIT: a90284b06420effb1ec1eeef14e7ed82e02c64e9
  PI_GUARD_COMMIT: 7a7580cc4cbd7926797564c72269394fc29a860a

jobs:
  build-test:
    name: Build + tests (darwin Intel x64)
    runs-on: macos-15-intel # explicit Intel (x86_64) image — first-class Intel lane
    steps:
      # actions/checkout v4.2.2 — pinned by full commit SHA (no floating refs)
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify runner architecture is x86_64 (Intel)
        run: |
          uname -m
          test "$(uname -m)" = "x86_64"

      # Exact validated evidence lane: Node v22.23.2 darwin-x64 from the
      # official nodejs.org distribution, SHA-256 pinned. Native Intel x64
      # is the lane's own architecture — no emulation, no Rosetta.
      - name: Provision exact Node 22.23.2 (darwin-x64)
        run: |
          set -euo pipefail
          curl -fsSLO https://nodejs.org/dist/v22.23.2/node-v22.23.2-darwin-x64.tar.gz
          echo "58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026  node-v22.23.2-darwin-x64.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xzf node-v22.23.2-darwin-x64.tar.gz -C "$RUNNER_TEMP/node" --strip-components=1
          rm node-v22.23.2-darwin-x64.tar.gz
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          node --version
          # The architecture is ASSERTED, not merely printed — anything
          # other than x64 fails this job (native Intel evidence).
          test "$(node -p process.arch)" = "x64"
          echo "node-arch=x64" >> "$GITHUB_STEP_SUMMARY"

      - name: Deterministic dependency install (lockfile)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Full suite incl. the APFS evidence tests (case variant, Unicode
      # NFC/NFD, symlink alias) — real default-APFS assertions on this
      # runner; the APFS object-identity invariant is architecture-
      # independent (ADR-042/043).
      - name: Full test suite (incl. APFS path evidence)
        run: npm test

      # SIR-PS6-004: mandatory APFS evidence — a DEDICATED invocation that
      # distinguishes PASS from NOT EXECUTED/SKIPPED. Any skip makes this
      # evidence job RED: first-class support evidence never silently
      # converts a missing APFS evidence test into green.
      - name: APFS evidence (mandatory — no silent skip)
        run: |
          ./node_modules/.bin/tsc -p tsconfig.tests.json
          node scripts/ci-apfs-evidence-strict.mjs

      - name: npm-pack executable + direct exec evidence
        run: |
          set -euo pipefail
          TGZ="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/packcheck"
          tar -xzf "$TGZ" -C "$RUNNER_TEMP/packcheck"
          "$RUNNER_TEMP/packcheck/package/dist/cli.js" --version
          "$RUNNER_TEMP/packcheck/package/dist/cli.js" --help >/dev/null
          echo "packed dist/cli.js executes directly on darwin Intel x64"

      # Exact Git 2.45.4 (SIR-PS6-003): ONE digest-pinned kernel.org source
      # artifact, user/workspace-scope source build (no sudo, no system Git
      # replacement), built version asserted exactly.
      - name: Provision exact Git 2.45.4 (digest-pinned, user scope, version asserted)
        run: |
          set -euo pipefail
          GIT_BIN="$(bash scripts/ci-provision-git-2454.sh "$RUNNER_TEMP/git-work" "$RUNNER_TEMP/git-2.45.4" | tail -1)"
          test "$("$GIT_BIN" --version)" = "git version 2.45.4"
          echo "$(dirname "$GIT_BIN")" >> "$GITHUB_PATH"

      - name: Volume case-sensitivity record (APFS evidence)
        run: |
          diskutil info / 2>/dev/null | grep -iE "file system personality|case-sensitive" || true
          echo "volume-facts recorded (default APFS expected case-insensitive)"

      - name: Clean-tree sanity
        run: git diff --check

  # ── Real-stack subsection (Lane C evidence, public multi-repo) ──────────
  # The exact public component checkouts are built/verified on the runner,
  # so no workflow_dispatch input or external fixture hosting is involved.
  real-stack:
    name: Real-stack integration (public multi-repo)
    runs-on: macos-15-intel
    needs: build-test
    steps:
      - name: Checkout pi-shuttle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify runner architecture is x86_64 (Intel)
        run: |
          uname -m
          test "$(uname -m)" = "x86_64"

      - name: Provision exact Node 22.23.2 (darwin-x64)
        run: |
          set -euo pipefail
          curl -fsSLO https://nodejs.org/dist/v22.23.2/node-v22.23.2-darwin-x64.tar.gz
          echo "58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026  node-v22.23.2-darwin-x64.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xzf node-v22.23.2-darwin-x64.tar.gz -C "$RUNNER_TEMP/node" --strip-components=1
          rm node-v22.23.2-darwin-x64.tar.gz
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          test "$(node -p process.arch)" = "x64"

      - name: Provision exact Git 2.45.4 (digest-pinned, user scope, version asserted)
        run: |
          set -euo pipefail
          GIT_BIN="$(bash scripts/ci-provision-git-2454.sh "$RUNNER_TEMP/git-work" "$RUNNER_TEMP/git-2.45.4" | tail -1)"
          test "$("$GIT_BIN" --version)" = "git version 2.45.4"
          echo "$(dirname "$GIT_BIN")" >> "$GITHUB_PATH"

      # Exact public component checkouts — full-SHA-pinned refs, never
      # branches/tags as authority. Public repositories: no credentials.
      # Lane C materializes ONLY the macOS Intel fork at the pinned
      # PGM-DIST-1 provenance-complete Git-tree commit (fetched from the
      # public remote — an operational Git fact, not a release claim).
      # The historical Gateway repository is never checked out by this
      # lane.
      - name: Checkout Gateway exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mfx-labs/project-gateway-macos
          ref: a90284b06420effb1ec1eeef14e7ed82e02c64e9
          path: gateway
          persist-credentials: false

      - name: Checkout pi-guard exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mfx-labs/pi-guard
          ref: 7a7580cc4cbd7926797564c72269394fc29a860a
          path: pi-guard
          # Full fetch so the v0.1.2 tag object is present and
          # prepare-fixtures.sh can assert the tag AT the pinned commit.
          fetch-depth: 0
          persist-credentials: false

      # Independent exact-commit assertion: git rev-parse HEAD must equal
      # the repository-owned pin for each component (fail closed). The
      # checked-out fork HEAD is verified against the pinned Intel
      # candidate commit BEFORE any fixture build or use.
      - name: Assert exact component HEADs
        run: |
          set -euo pipefail
          GW_HEAD="$(git -C "${{ github.workspace }}/gateway" rev-parse HEAD)"
          PG_HEAD="$(git -C "${{ github.workspace }}/pi-guard" rev-parse HEAD)"
          test "$GW_HEAD" = "$GATEWAY_COMMIT" || { echo "gateway HEAD mismatch: expected $GATEWAY_COMMIT got $GW_HEAD" >&2; exit 1; }
          test "$PG_HEAD" = "$PI_GUARD_COMMIT" || { echo "pi-guard HEAD mismatch: expected $PI_GUARD_COMMIT got $PG_HEAD" >&2; exit 1; }
          echo "gateway HEAD == $GW_HEAD (exact pinned Intel fork candidate)"
          echo "pi-guard HEAD == $PG_HEAD (exact public pin, v0.1.2)"

      # The committed fixture builder: the authoritative artifact-build and
      # provenance boundary. Exact checkouts → clean build/package →
      # fixture-manifest.json + SHA-256. Wrong commit / dirty checkout
      # fails closed inside the script. The B preparation surface receives
      # the Intel lane EXPLICITLY (--lane); an unknown/mismatched lane
      # fails closed instead of silently preparing the historical Gateway.
      - name: Build fixtures from exact public checkouts
        run: |
          set -euo pipefail
          bash scripts/prepare-fixtures.sh \
            --gateway-checkout "${{ github.workspace }}/gateway" \
            --pi-guard-checkout "${{ github.workspace }}/pi-guard" \
            --out "$RUNNER_TEMP/fixtures" \
            --lane darwin-x86_64-posix-utf8-node22
          test -f "$RUNNER_TEMP/fixtures/fixture-manifest.json"
          test -f "$RUNNER_TEMP/fixtures/project-gateway-macos-core-0.1.0.tgz"
          test -f "$RUNNER_TEMP/fixtures/pi-guard-0.1.2.tgz"
          cat "$RUNNER_TEMP/fixtures/fixture-manifest.json"

      - name: Deterministic dependency install (lockfile)
        run: npm ci

      - name: Build pi-shuttle
        run: npm run build

      - name: Isolated Pi 0.83.0 lane (no real user Pi state)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pi-lane"
          cd "$RUNNER_TEMP/pi-lane"
          npm init -y >/dev/null
          npm install --no-save @earendil-works/pi-coding-agent@0.83.0 >/dev/null
          "$RUNNER_TEMP/pi-lane/node_modules/.bin/pi" --version
          test -f "$RUNNER_TEMP/pi-lane/node_modules/@earendil-works/pi-coding-agent/dist/core/extensions/loader.js"

      # The C3B1 real-stack / handshake surface receives the Intel lane
      # EXPLICITLY (GATEWAY_LANE): the sole identity selector of the
      # exact-nine MCP handshake probe. Never ambient, never defaulted;
      # an unknown/mismatched lane fails closed in the script/probe.
      - name: Real-stack evidence (installer → lifecycle → MCP → pi-guard)
        env:
          EVIDENCE_LABEL: "LANE C"
          FIXTURE_DIR: "${{ runner.temp }}/fixtures"
          WORK_ROOT: "${{ runner.temp }}/realstack"
          PSHUTTLE_REPO: "${{ github.workspace }}"
          PI_LANE_BIN: "${{ runner.temp }}/pi-lane/node_modules/.bin"
          PI_LOADER: "${{ runner.temp }}/pi-lane/node_modules/@earendil-works/pi-coding-agent/dist/core/extensions/loader.js"
          GIT_2454: "${{ runner.temp }}/git-2.45.4/bin/git"
          NODE_BIN: "${{ runner.temp }}/node/bin/node"
          GATEWAY_COMMIT: "${{ env.GATEWAY_COMMIT }}"
          PI_GUARD_COMMIT: "${{ env.PI_GUARD_COMMIT }}"
          GATEWAY_LANE: darwin-x86_64-posix-utf8-node22
        run: bash scripts/ci-lane-b-real-stack.sh
